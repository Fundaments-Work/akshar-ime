# Cloudflare Workers — Akshar playground (static assets only).
# Deploy: `make playground-deploy` (builds first), or:
#   wrangler deploy --config apps/playground/wrangler.toml
# Pages alternative (no wrangler config needed):
#   wrangler pages deploy apps/playground/public --project-name akshar-playground
#
# The model is NOT bundled: upload once to R2 (see README.md), then bake its
# public URL with MODEL_URL=... apps/playground/build.sh before deploying.
name = "akshar-playground"
compatibility_date = "2026-09-22"

[assets]
directory = "./public"
