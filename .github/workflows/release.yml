name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.0, leave empty for manual run without release)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev libjansson-dev brotli

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Build WASM package
        run: bash packages/engine-wasm/build.sh

      - name: Build Native Linux Release
        run: make release

      - name: Package release artifacts
        run: |
          mkdir -p dist
          # WASM engine artifacts
          cp packages/engine-wasm/pkg/akshar_ime_bg.wasm dist/
          cp packages/engine-wasm/pkg/akshar_ime.js dist/
          cp packages/engine-wasm/pkg/akshar_ime.d.ts dist/
          cp packages/engine-wasm/pkg/akshar_ime_bg.wasm.d.ts dist/
          cp packages/engine-js/akshar-ime.js dist/
          # NOTE: tar resolves each -C relative to the previous one, so the
          # second path is relative to packages/engine-wasm/pkg.
          tar -czf dist/akshar-ime-wasm.tar.gz -C packages/engine-wasm/pkg . -C ../../engine-js akshar-ime.js
          
          # Native Linux artifacts
          cp target/release/libakshar_ime.so dist/
          cp target/release/devanagari-smart dist/
          cp devanagari-smart.xml dist/
          tar -czf dist/akshar-ime-linux-x86_64.tar.gz -C dist libakshar_ime.so devanagari-smart devanagari-smart.xml
          
          echo "=== Release Artifacts ==="
          ls -lh dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/akshar_ime_bg.wasm
            dist/akshar_ime.js
            dist/akshar_ime.d.ts
            dist/akshar_ime_bg.wasm.d.ts
            dist/akshar-ime.js
            dist/akshar-ime-wasm.tar.gz
            dist/akshar-ime-linux-x86_64.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
