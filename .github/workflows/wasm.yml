name: WASM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Build WASM package
        run: bash packages/engine-wasm/build.sh

      - name: Verify WASM artifacts exist
        run: |
          test -f packages/engine-wasm/pkg/akshar_ime_bg.wasm
          test -f packages/engine-wasm/pkg/akshar_ime.js

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: |
            packages/engine-wasm/pkg/
            packages/engine-js/akshar-ime.js
