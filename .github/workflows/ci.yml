name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev libjansson-dev

      - name: Build (Rust library + C engine)
        run: make release

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

      - name: WASM target check
        run: |
          if rustup target list --installed 2>/dev/null | grep -q wasm32-unknown-unknown; then
            cargo check --features wasm --target wasm32-unknown-unknown
          else
            echo "wasm32 target not installed; skipping"
          fi
