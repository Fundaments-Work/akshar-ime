
[package]
name = "akshar_ime"
version = "1.2.0"
edition = "2021"
authors = ["Sabin"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tempfile = "3.10"
libc = "0.2"
dirs = "5.0"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rustc-hash = "1.1"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
fst = "0.4"
smallvec = "1.13"
wasm-bindgen = { version = "=0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
web-sys = { version = "=0.3.77", optional = true, features = [
  "Window",
  "Storage",
  "Response",
  "Request",
  "Headers",
  "console",
] }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "wasm-bindgen-futures", "getrandom", "web-sys"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[lib]
name = "akshar_ime"
crate-type = ["cdylib", "rlib"]

# ------------------------------------------------------------------------------
# Training Pipeline (src/bin/train/)
# ------------------------------------------------------------------------------

[[bin]]
name = "train"
path = "src/bin/train/train.rs"

# ------------------------------------------------------------------------------
# Evaluation & Benchmark Binaries (src/bin/evaluate/)
# ------------------------------------------------------------------------------

[[bin]]
name = "evaluate_aksharantar"
path = "src/bin/evaluate/evaluate_aksharantar.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate/evaluate.rs"

[[bin]]
name = "eval_ime"
path = "src/bin/evaluate/eval_ime.rs"

[[bin]]
name = "tune_weights"
path = "src/bin/evaluate/tune_weights.rs"

[[bin]]
name = "evaluate_sentences"
path = "src/bin/evaluate/evaluate_sentences.rs"

[[bin]]
name = "analyze_errors"
path = "src/bin/evaluate/analyze_errors.rs"

# ------------------------------------------------------------------------------
# Data Construction & Utility Binaries (src/bin/build/)
# ------------------------------------------------------------------------------

[[bin]]
name = "build_corpus_bigrams"
path = "src/bin/build/build_corpus_bigrams.rs"

[[bin]]
name = "pack_model"
path = "src/bin/build/pack_model.rs"

[[bin]]
name = "prepare_pairs"
path = "src/bin/build/prepare_pairs.rs"

[[bin]]
name = "build_wordfreq_text"
path = "src/bin/build/build_wordfreq_text.rs"

[[bin]]
name = "romanize"
path = "src/bin/build/romanize.rs"

[[bin]]
name = "prune_lm"
path = "src/bin/build/prune_lm.rs"

[[bin]]
name = "repack_model"
path = "src/bin/build/repack_model.rs"

[[bin]]
name = "quantize_model"
path = "src/bin/build/quantize_model.rs"

[[bin]]
name = "probe_model"
path = "src/bin/build/probe_model.rs"

[[bin]]
name = "prune_model"
path = "src/bin/build/prune_model.rs"